# Development override: live Python code via bind mounts, auto-reloading
# gunicorn, and test-friendly settings. Never use in production.

x-dev-apps: &dev_apps
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs
  - ../../apps/noria_practice:/home/frappe/frappe-bench/apps/noria_practice
  - ../../apps/noria_ledger:/home/frappe/frappe-bench/apps/noria_ledger

services:
  backend:
    volumes: *dev_apps
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=4
      - --workers=2
      - --worker-class=gthread
      - --timeout=300
      - --reload
      - frappe.app:application
  queue-short:
    volumes: *dev_apps
  queue-long:
    volumes: *dev_apps
  scheduler:
    volumes: *dev_apps
  provisioner:
    volumes: *dev_apps
  configurator:
    volumes: *dev_apps
